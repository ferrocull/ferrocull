name: Audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/audit.yml
  # Advisories are published against crates already in Cargo.lock, so a
  # daily run catches them without waiting for a push.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
