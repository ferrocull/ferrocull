name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBJPEG_TURBO_VERSION: 3.2.0
  LIBJPEG_TURBO_SHA256: 21297da4a4eb34ebefc54afca5d8dd86c0fdd6a9dfe49b1b962c5d1eeeafd8ec

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgphoto2-dev
      # turbojpeg needs libturbojpeg >= 3.0; Ubuntu only packages 2.1.5, so
      # install the upstream release, which lands outside the default
      # pkg-config and linker search paths.
      - name: Install libjpeg-turbo
        run: |
          deb="libjpeg-turbo-official_${LIBJPEG_TURBO_VERSION}_amd64.deb"
          curl -fsSLO "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/${deb}"
          echo "${LIBJPEG_TURBO_SHA256}  ${deb}" | sha256sum --check --strict
          sudo dpkg -i "$deb"
          echo "PKG_CONFIG_PATH=/opt/libjpeg-turbo/lib64/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/libjpeg-turbo/lib64" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

  shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - name: Shear
        run: cargo shear
