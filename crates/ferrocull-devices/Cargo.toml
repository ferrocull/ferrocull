[package]
name = "ferrocull-devices"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
ferrocull-media = { workspace = true }
thiserror = { workspace = true }
tracing.workspace = true
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false }
gphoto2 = "3"
nix = { version = "0.31", features = ["fs"] }
tokio = { workspace = true, features = ["macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.31", features = ["fs"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
] }
objc2-disk-arbitration = { version = "0.3.2", default-features = false, features = [
  "std",
  "DADisk",
  "DADissenter",
  "DASession",
  "dispatch2",
  "libc",
] }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
] }

[lints]
workspace = true
