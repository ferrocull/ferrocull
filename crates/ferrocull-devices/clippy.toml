# Clippy reads the nearest clippy.toml and does not merge it with the
# workspace one, so the workspace thresholds are repeated here.
excessive-nesting-threshold = 6
too-many-lines-threshold = 160
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# This crate runs on the tokio runtime; blocking filesystem calls stall it.
disallowed-methods = [
  { path = "std::fs::read", reason = "blocks the async runtime", replacement = "tokio::fs::read" },
  { path = "std::fs::read_to_string", reason = "blocks the async runtime", replacement = "tokio::fs::read_to_string" },
  { path = "std::fs::read_dir", reason = "blocks the async runtime", replacement = "tokio::fs::read_dir" },
  { path = "std::fs::read_link", reason = "blocks the async runtime", replacement = "tokio::fs::read_link" },
  { path = "std::fs::metadata", reason = "blocks the async runtime", replacement = "tokio::fs::metadata" },
  { path = "std::fs::symlink_metadata", reason = "blocks the async runtime", replacement = "tokio::fs::symlink_metadata" },
  { path = "std::fs::canonicalize", reason = "blocks the async runtime", replacement = "tokio::fs::canonicalize" },
  { path = "std::fs::write", reason = "blocks the async runtime", replacement = "tokio::fs::write" },
  { path = "std::fs::copy", reason = "blocks the async runtime", replacement = "tokio::fs::copy" },
  { path = "std::fs::rename", reason = "blocks the async runtime", replacement = "tokio::fs::rename" },
  { path = "std::fs::remove_file", reason = "blocks the async runtime", replacement = "tokio::fs::remove_file" },
  { path = "std::fs::remove_dir", reason = "blocks the async runtime", replacement = "tokio::fs::remove_dir" },
  { path = "std::fs::remove_dir_all", reason = "blocks the async runtime", replacement = "tokio::fs::remove_dir_all" },
  { path = "std::fs::create_dir", reason = "blocks the async runtime", replacement = "tokio::fs::create_dir" },
  { path = "std::fs::create_dir_all", reason = "blocks the async runtime", replacement = "tokio::fs::create_dir_all" },
  { path = "std::fs::File::open", reason = "blocks the async runtime", replacement = "tokio::fs::File::open" },
  { path = "std::fs::File::create", reason = "blocks the async runtime", replacement = "tokio::fs::File::create" },
]
