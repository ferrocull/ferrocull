<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="256" cy="256" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a1f05"/>
      <stop offset="35%" stop-color="#1a0d02"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="bloom" cx="256" cy="256" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A06210" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#7E5412" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#7E5412" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .55
                             0 0 0 0 .35
                             0 0 0 0 .15
                             0 0 0 .22 0"/>
    </filter>
    <clipPath id="disk">
      <circle cx="256" cy="256" r="239"/>
    </clipPath>
    <g id="filings">
      <line x1="-3" y1="-80" x2="3" y2="-74" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-8" y1="-62" x2="2" y2="-57" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="3" y1="-64" x2="11" y2="-58" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-12" y1="-44" x2="-2" y2="-39" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="3" y1="-47" x2="14" y2="-41" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-15" y1="-23" x2="-4" y2="-18" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="1" y1="-25" x2="12" y2="-20" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="14" y1="-26" x2="22" y2="-21" stroke="#A06210" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-19" y1="-2" x2="-8" y2="3" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-3" y1="-4" x2="9" y2="2" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="10" y1="-3" x2="22" y2="2" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-20" y1="18" x2="-9" y2="22" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-4" y1="20" x2="8" y2="25" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="10" y1="18" x2="22" y2="22" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-18" y1="38" x2="-8" y2="42" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-2" y1="40" x2="9" y2="44" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="11" y1="38" x2="21" y2="42" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-14" y1="58" x2="-5" y2="62" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="0" y1="60" x2="11" y2="64" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="13" y1="58" x2="20" y2="62" stroke="#A06210" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-10" y1="76" x2="-1" y2="80" stroke="#F0D468" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="3" y1="76" x2="12" y2="80" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="-3" y1="86" x2="5" y2="88" stroke="#D4A030" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <g clip-path="url(#disk)">
    <rect x="0" y="0" width="512" height="512" filter="url(#grain)"/>
    <circle cx="256" cy="256" r="150" fill="url(#bloom)"/>
  </g>
  <circle cx="256" cy="256" r="238.75" fill="none" stroke="#D4A030" stroke-width="2.5"/>

  <g transform="translate(256,256)">
    <use href="#filings" transform="rotate(0)   translate(0,-116) rotate(28) scale(1,1.12)"/>
    <use href="#filings" transform="rotate(60)  translate(0,-116) rotate(28) scale(1,1.12)"/>
    <use href="#filings" transform="rotate(120) translate(0,-116) rotate(28) scale(1,1.12)"/>
    <use href="#filings" transform="rotate(180) translate(0,-116) rotate(28) scale(1,1.12)"/>
    <use href="#filings" transform="rotate(240) translate(0,-116) rotate(28) scale(1,1.12)"/>
    <use href="#filings" transform="rotate(300) translate(0,-116) rotate(28) scale(1,1.12)"/>
  </g>

  <g transform="translate(256,256)" stroke-linecap="round" stroke-width="2.4">
    <line x1="-3" y1="-15" x2="-3" y2="-7" stroke="#D4A030"/>
    <line x1="3" y1="-15" x2="3" y2="-7" stroke="#F0D468"/>
    <line x1="-9" y1="-9" x2="-9" y2="-1" stroke="#A06210"/>
    <line x1="-3" y1="-9" x2="-3" y2="-1" stroke="#F0D468"/>
    <line x1="3" y1="-9" x2="3" y2="-1" stroke="#fff4d0"/>
    <line x1="9" y1="-9" x2="9" y2="-1" stroke="#F0D468"/>
    <line x1="-12" y1="-3" x2="-12" y2="5" stroke="#D4A030"/>
    <line x1="-5" y1="-3" x2="-5" y2="5" stroke="#F0D468"/>
    <line x1="1" y1="-3" x2="1" y2="5" stroke="#D4A030"/>
    <line x1="7" y1="-3" x2="7" y2="5" stroke="#F0D468"/>
    <line x1="12" y1="-3" x2="12" y2="5" stroke="#A06210"/>
    <line x1="-9" y1="3" x2="-9" y2="11" stroke="#F0D468"/>
    <line x1="-3" y1="3" x2="-3" y2="11" stroke="#D4A030"/>
    <line x1="3" y1="3" x2="3" y2="11" stroke="#F0D468"/>
    <line x1="9" y1="3" x2="9" y2="11" stroke="#A06210"/>
    <line x1="-3" y1="9" x2="-3" y2="17" stroke="#D4A030"/>
    <line x1="3" y1="9" x2="3" y2="17" stroke="#F0D468"/>
  </g>
</svg>
