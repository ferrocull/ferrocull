<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="256" cy="256" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a2708"/>
      <stop offset="40%" stop-color="#2a1605"/>
      <stop offset="100%" stop-color="#120a03"/>
    </radialGradient>
    <radialGradient id="bloom" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D98E48" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#A06210" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#7E5412" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="256" cy="256" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4d0" stop-opacity=".6"/>
      <stop offset="45%" stop-color="#F0D468" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#D98E48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ray" cx="0" cy="0" r="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="36%" stop-color="#fff4d0"/>
      <stop offset="50%" stop-color="#f0d468"/>
      <stop offset="65%" stop-color="#c9973a"/>
      <stop offset="81%" stop-color="#9a6529"/>
      <stop offset="100%" stop-color="#6e461d"/>
    </radialGradient>
    <radialGradient id="spark" cx="0" cy="0" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="45%" stop-color="#fff4d0"/>
      <stop offset="78%" stop-color="#f0d468"/>
      <stop offset="100%" stop-color="#c9973a"/>
    </radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .55
                             0 0 0 0 .35
                             0 0 0 0 .15
                             0 0 0 .18 0"/>
    </filter>
    <clipPath id="disk">
      <circle cx="256" cy="256" r="239"/>
    </clipPath>
    <g id="blade" stroke-linecap="round" stroke-width="9">
    <line x1="-30.0" y1="-88.0" x2="-2.0" y2="-88.0" stroke="#fff4d0" stroke-width="9"/>
    <line x1="21.4" y1="-88.0" x2="49.4" y2="-88.0" stroke="#fff4d0" stroke-width="9"/>
    <line x1="72.9" y1="-88.0" x2="100.9" y2="-88.0" stroke="#fff4d0" stroke-width="9"/>
    <line x1="124.4" y1="-88.0" x2="152.4" y2="-88.0" stroke="#fff4d0" stroke-width="9"/>
    <line x1="175.8" y1="-88.0" x2="203.8" y2="-88.0" stroke="#fff4d0" stroke-width="9"/>
    <line x1="-14.4" y1="-115.0" x2="13.6" y2="-115.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="29.6" y1="-115.0" x2="57.6" y2="-115.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="73.7" y1="-115.0" x2="101.7" y2="-115.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="117.8" y1="-115.0" x2="145.8" y2="-115.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="161.9" y1="-115.0" x2="189.9" y2="-115.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="1.2" y1="-142.0" x2="29.2" y2="-142.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="48.3" y1="-142.0" x2="76.3" y2="-142.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="95.5" y1="-142.0" x2="123.5" y2="-142.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="142.6" y1="-142.0" x2="170.6" y2="-142.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="16.7" y1="-169.0" x2="44.7" y2="-169.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="66.3" y1="-169.0" x2="94.3" y2="-169.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="116.0" y1="-169.0" x2="144.0" y2="-169.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="32.3" y1="-196.0" x2="60.3" y2="-196.0" stroke="url(#ray)" stroke-width="9"/>
    <line x1="76.2" y1="-196.0" x2="104.2" y2="-196.0" stroke="url(#ray)" stroke-width="9"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <g clip-path="url(#disk)">
    <rect x="0" y="0" width="512" height="512" filter="url(#grain)"/>
    <circle cx="256" cy="256" r="200" fill="url(#bloom)"/>
  </g>
  <circle cx="256" cy="256" r="237" fill="none" stroke="#fff4d0" stroke-width="6"/>

  <g transform="translate(256,256)">
    <use href="#blade" transform="rotate(0)"/>
    <use href="#blade" transform="rotate(60)"/>
    <use href="#blade" transform="rotate(120)"/>
    <use href="#blade" transform="rotate(180)"/>
    <use href="#blade" transform="rotate(240)"/>
    <use href="#blade" transform="rotate(300)"/>
  </g>

  <circle cx="256" cy="256" r="54" fill="url(#core)"/>
  <g transform="translate(256,256)" stroke-linecap="round" stroke-width="9">
    <line x1="-10.36" y1="-18.59" x2="7.64" y2="-15.59" stroke="url(#spark)"/>
    <line x1="-30.26" y1="-7.08" x2="-12.25" y2="-4.08" stroke="url(#spark)"/>
    <line x1="13.64" y1="-4.46" x2="30.87" y2="-1.59" stroke="url(#spark)"/>
    <line x1="-26.15" y1="6.11" x2="-8.29" y2="9.09" stroke="url(#spark)"/>
    <line x1="14.35" y1="8.44" x2="31.37" y2="11.28" stroke="url(#spark)"/>
    <line x1="-4.58" y1="19.36" x2="13.43" y2="22.36" stroke="url(#spark)"/>
  </g>
</svg>
